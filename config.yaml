# ============================================================
#  AI-Trade — Master Configuration
# ============================================================

trading:
  symbols: ["XAUUSD"]
  timeframe: "M15"
  magic_number: 20240101

risk:
  risk_per_trade: 0.003
  max_concurrent_trades: 3   # รวมทุกทิศทาง
  max_per_direction: 2       # สูงสุด 2 ไม้ต่อทิศ (BUY หรือ SELL)
  max_concurrent_trades: 1
  max_per_direction: 1
  max_daily_loss: 0.04
  max_weekly_loss: 0.10
  max_drawdown: 0.08
  min_rr_ratio: 1.8
  atr_sl_multiplier: 1.8
  atr_tp_multiplier: 3.6
  use_kelly: false
  kelly_max_fraction: 0.005
  dd_scale_start: 0.02
  dd_scale_min: 0.20
  max_loss_streak: 3
  loss_streak_scale: 0.35
  mode: "safe"
  safe_risk_multiplier: 0.50
  aggressive_risk_multiplier: 1.00
  adaptive_cooldown:
    enabled: true
    hours_map:                 # streak -> hours of global pause
      1: 2                     # 1 consecutive loss  → 2h soft pause
      2: 4                     # 2 consecutive losses → 4h hard pause
      3: 12                    # 3 consecutive losses → 12h extended pause
    halt_at_streak: 4          # 4+ losses → full halt (manual reset required)

strategy:
  ema_fast: 50
  ema_slow: 200
  rsi_period: 14
  rsi_buy_min:  45
  rsi_buy_max:  75
  rsi_sell_min: 25
  rsi_sell_max: 55
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  atr_threshold_multiplier: 0.50
  structure_lookback: 20
  swing_strength: 5
  min_confluence: 3          # เพิ่มจาก 2 → 3 (2/4 ง่ายเกิน)
  adx_period: 14
  adx_trend_threshold:    25
  adx_range_threshold:    18
  adx_high_vol_threshold: 42
  bb_period: 20
  bb_std: 2.0
  stoch_k: 14
  stoch_d: 3
  stoch_smooth: 3
  range_rsi_oversold:   33
  range_rsi_overbought: 67
  range_bb_pct_buy:  0.12
  range_bb_pct_sell: 0.88
  high_vol_sl_multiplier: 1.6
  high_vol_size_scale:    0.65

sessions:
  enabled: false             # false = เทรด 24 ชั่วโมงตั้งแต่เปิด Program
                              # true  = เฉพาะ London+NY เท่านั้น
  enabled: true
  london:
    start: "07:00"
    end:   "16:00"
  new_york:
    start: "12:00"
    end:   "21:00"

ai:
  enabled: true
  min_confidence: 55        # ใช้เป็น threshold ที่ AI คัดค้าน direction อย่างมั่นใจ
  min_confidence: 68
  model_type: "ensemble"
  retrain_interval: 360
  forward_bars: 12
  target_move_pct: 0.0025
  training_bars: 2000

optimizer:
  n_trials: 40
  interval_cycles: 3

trade_management:
  breakeven_r:          1.0
  breakeven_buffer_pts: 5
  trailing_r:           1.5
  trailing_atr_mult:    1.0
  trailing_step_r:      0.5
  partial_close: true
  partial_close_stages:
    - r: 1.0
      pct: 0.30
    - r: 2.0
      pct: 0.30
    - r: 3.0
      pct: 0.40
  time_exit_enabled: true
  time_exit_bars:    48
  time_exit_min_r:  -0.3
  cooldown_minutes: 60       # ห่างระหว่างไม้บน symbol เดิมอย่างน้อย 60 นาที

  news_filter_enabled: true  # หยุดเทรด 30 นาทีก่อน / 15 นาทีหลัง ข่าว High Impact
  news_blackout_before: 30   # นาที ก่อนข่าว
  news_blackout_after:  15   # นาที หลังข่าว
  cooldown_minutes: 90
  min_sl_points:    12.0
  max_spread_gold:  10.0
  max_spread_forex:  6.0

execution:
  max_retries: 3
  retry_delay: 1
  deviation:   20

htf_filter:
  enabled: true
  timeframe: "H4"            # H4 = กรอง trend ใหญ่
  ema_period: 200
  bars: 250                  # ต้องการ 250 แท่ง H4 สำหรับ EMA200
  neutral_zone: 0.005        # 0.5% buffer ($22 บน gold) — ป้องกัน EMA200 retest

direction_ban:
  enabled: true
  max_same_dir_losses: 2     # hard ban หลังแพ้ซ้อน 2 ครั้ง
  ban_hours: 4               # hard ban 4 ชั่วโมง
  ban_hours_soft: 2          # soft ban 2 ชั่วโมง (หลังแพ้ 1 ครั้ง → ลด lot 50%)

# ── Trend Dominance Protection ─────────────────────────────────────────────
# ป้องกันการเปิด counter-trend เมื่อตลาดมีแนวโน้มชัดเจน
trend_dominance:
  enabled: true
  adx_strong_threshold:   28     # ADX ≥ 28 = เทรนด์แข็งแกร่ง
  trend_strength_block:  0.55    # strength score ≥ 0.55 = บล็อก counter-trend
  exhaustion_ema200_pct: 0.025   # ห่างจาก EMA200 > 2.5% = exhausted (block เพิ่ม)
  rsi_recovery_level:     38     # RSI ต่ำกว่า 38 แล้วเด้งขึ้น = shorts exhausted
  rsi_rejection_level:    62     # RSI สูงกว่า 62 แล้วตกลง = longs exhausted
  rsi_momentum_swing:      5     # RSI ต้องขยับ ≥ 5 pts ถึงนับเป็น recovery/rejection

market_intelligence:
  enabled: true
  adx_strong: 28               # ADX threshold for "strong trend" regime
  divergence_lookback: 35      # bars to look back for RSI/MACD divergence
  swing_strength: 3            # swing point detection sensitivity (lower = more sensitive)
  displacement_atr_mult: 2.0   # body must be >= N×ATR to count as displacement candle
  reversal_score_threshold: 2  # how many reversal sub-signals needed to fire REVERSAL regime

dashboard:
  refresh_interval: 5
  port: 8001

# ── Progressive Autonomy System ────────────────────────────────────────────
# Controls how much the AI Brain overrides rule-based strategy signals.
#
# Levels:
#   0  RULE_BASED           — Strategy + MI only; Brain logs and adjusts risk
#   1  RULE_PLUS_AI_FILTER  — Brain can reduce lot; emergency blocks only
#   2  AI_ASSISTED          — Brain influences sizing via bootstrap confidence
#   3  SEMI_AUTONOMOUS      — Brain can override strategy signal
#   4  FULL_AUTONOMOUS      — Brain is sole decision maker
#
# Auto-upgrade when criteria are met; auto-downgrade on 5+ loss streak or DD ≥ 8%.
progressive_autonomy:
  enabled: true
  initial_level: 0           # Start at RULE_BASED to avoid cold-start deadlock
  max_level: 4               # Maximum allowed level (set to 2 for conservative mode)
  # Upgrade criteria (cumulative — checked automatically each cycle):
  #   L0→L1: 10 trades
  #   L1→L2: 30 trades, AUC ≥ 0.48, winrate ≥ 40%
  #   L2→L3: 75 trades, AUC ≥ 0.52, winrate ≥ 45%, DD ≤ 10%
  #   L3→L4: 150 trades, AUC ≥ 0.55, winrate ≥ 50%, DD ≤ 8%
  # Downgrade triggers:
  #   5+ consecutive losses  OR  drawdown ≥ 8%

  max_level: 2

learning_analytics:
  enabled: true
  min_trades: 8           # minimum closed trades per context before applying penalty
  block_win_rate: 0.20    # block trade if context win_rate < 20%
  penalty_win_rate: 0.38  # apply score penalty if win_rate < 38%
  lookback_days: 60       # how far back to query historical trades

logging:
  level: "DEBUG"
  file: "logs/trading.log"
  max_size_mb: 50
