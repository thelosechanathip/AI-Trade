# ============================================================
# AI-Trade - Master Configuration
# ============================================================

trading:
  symbols: ["XAUUSD"]
  timeframe: "M15"
  magic_number: 20240101

risk:
  risk_per_trade: 0.035
  max_concurrent_trades: 4
  max_per_direction: 3
  max_daily_loss: 0.08
  max_weekly_loss: 0.16
  max_drawdown: 0.25
  min_rr_ratio: 1.2
  atr_sl_multiplier: 1.15
  atr_tp_multiplier: 4.6
  use_kelly: true
  kelly_max_fraction: 0.060
  dd_scale_start: 0.10
  dd_scale_min: 0.55
  max_loss_streak: 5
  loss_streak_scale: 0.75
  mode: "aggressive"
  safe_risk_multiplier: 0.50
  aggressive_risk_multiplier: 1.55
  adaptive_cooldown:
    enabled: true
    hours_map:
      1: 0
      2: 0.5
      3: 1
      4: 3
      5: 8
    halt_at_streak: 6

strategy:
  ema_fast: 50
  ema_slow: 200
  rsi_period: 14
  rsi_buy_min: 40
  rsi_buy_max: 78
  rsi_sell_min: 22
  rsi_sell_max: 60
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  atr_threshold_multiplier: 0.35
  structure_lookback: 15
  swing_strength: 4
  min_confluence: 2
  adx_period: 14
  adx_trend_threshold: 20
  adx_range_threshold: 15
  adx_high_vol_threshold: 45
  bb_period: 20
  bb_std: 2.0
  stoch_k: 14
  stoch_d: 3
  stoch_smooth: 3
  range_rsi_oversold: 38
  range_rsi_overbought: 62
  range_bb_pct_buy: 0.18
  range_bb_pct_sell: 0.82
  high_vol_sl_multiplier: 1.4
  high_vol_size_scale: 0.75

sessions:
  enabled: true
  london:
    start: "06:00"
    end: "17:00"
  new_york:
    start: "12:00"
    end: "22:00"

ai:
  enabled: true
  min_confidence: 45
  conflict_block_confidence: 78
  model_type: "ensemble"
  retrain_interval: 240
  forward_bars: 8
  target_move_pct: 0.0025
  training_bars: 2000

optimizer:
  n_trials: 40
  interval_cycles: 3

entry_filters:
  signal_stability_cycles: 1
  signal_stability_window: 4
  noise_threshold: 0.74
  chase_threshold: 0.74
  grade_a_plus_score: 0.62
  grade_a_score: 0.48
  grade_b_score: 0.34
  grade_a_scale: 0.95
  grade_b_scale: 0.85
  conf_full_score: 0.58
  conf_mid_score: 0.46
  conf_low_score: 0.34
  conf_mid_scale: 0.95
  conf_low_scale: 0.85

trade_management:
  breakeven_r: 1.0
  breakeven_buffer_pts: 2
  trailing_r: 1.8
  trailing_atr_mult: 1.1
  trailing_step_r: 0.7
  partial_close: true
  partial_close_stages:
    - r: 1.2
      pct: 0.10
    - r: 2.5
      pct: 0.25
    - r: 4.0
      pct: 0.65
  time_exit_enabled: true
  time_exit_bars: 28
  time_exit_min_r: -0.35
  cooldown_minutes: 8
  recent_loss_penalty_minutes: 8
  recent_loss_penalty_score: 0.02
  news_filter_enabled: true
  news_blackout_before: 8
  news_blackout_after: 3
  min_sl_points: 6.0
  max_spread_gold: 28.0
  max_spread_forex: 10.0

execution:
  max_retries: 3
  retry_delay: 1
  deviation: 30

htf_filter:
  enabled: true
  timeframe: "H4"
  ema_period: 200
  bars: 250
  neutral_zone: 0.010

direction_ban:
  enabled: true
  max_same_dir_losses: 4
  ban_hours: 3
  ban_hours_soft: 0.5
  opposite_cooldown_min: 10

trend_dominance:
  enabled: true
  adx_strong_threshold: 30
  trend_strength_block: 0.78
  exhaustion_ema200_pct: 0.035
  rsi_recovery_level: 34
  rsi_rejection_level: 66
  rsi_momentum_swing: 5

market_intelligence:
  enabled: true
  adx_strong: 30
  divergence_lookback: 35
  swing_strength: 3
  displacement_atr_mult: 2.6
  reversal_score_threshold: 3

dashboard:
  refresh_interval: 5
  port: 8001

progressive_autonomy:
  enabled: true
  initial_level: 1
  max_level: 3
  risk_scales:
    0: 0.90
    1: 1.00
    2: 1.10
    3: 1.15
    4: 1.20
  bootstrap_weights:
    0: 0.85
    1: 0.60
    2: 0.40
    3: 0.20
    4: 0.00
  min_score_thresholds:
    0: 0.12
    1: 0.16
    2: 0.22
    3: 0.28
    4: 0.32

learning_analytics:
  enabled: true
  min_trades: 15
  block_win_rate: 0.12
  penalty_win_rate: 0.25
  lookback_days: 60

committee_guard:
  enabled: true
  fail_closed: true
  min_score: 0.50
  min_score_safe: 0.66
  min_agent_approvals: 3
  min_adjusted_score: 0.34
  max_uncertainty: 0.86
  max_reversal_probability: 0.84
  max_noise_score: 0.72
  max_chase_score: 0.72
  max_spread_atr_ratio: 0.16
  warning_spread_atr_ratio: 0.12
  htf_conflict_strength: 0.70
  blocked_regimes: ["EXHAUSTION"]
  caution_regimes: ["HIGH_VOL", "RANGE", "REVERSAL", "LIQUIDITY_GRAB", "ACCUMULATION", "DISTRIBUTION"]

logging:
  level: "DEBUG"
  file: "logs/trading.log"
  max_size_mb: 50
