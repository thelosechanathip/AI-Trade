# ============================================================
# AI-Trade - Master Configuration
# ============================================================

trading:
  symbols: ["XAUUSD"]
  timeframe: "M15"
  magic_number: 20240101

risk:
  risk_per_trade: 0.001
  max_concurrent_trades: 1
  max_per_direction: 1
  max_daily_loss: 0.015
  max_weekly_loss: 0.04
  max_drawdown: 0.05
  min_rr_ratio: 1.8
  atr_sl_multiplier: 1.8
  atr_tp_multiplier: 3.6
  use_kelly: false
  kelly_max_fraction: 0.005
  dd_scale_start: 0.02
  dd_scale_min: 0.20
  max_loss_streak: 3
  loss_streak_scale: 0.35
  mode: "safe"
  safe_risk_multiplier: 0.50
  aggressive_risk_multiplier: 1.00
  adaptive_cooldown:
    enabled: true
    hours_map:
      1: 4
      2: 12
      3: 24
    halt_at_streak: 3

strategy:
  ema_fast: 50
  ema_slow: 200
  rsi_period: 14
  rsi_buy_min: 45
  rsi_buy_max: 75
  rsi_sell_min: 25
  rsi_sell_max: 55
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  atr_threshold_multiplier: 0.50
  structure_lookback: 20
  swing_strength: 5
  min_confluence: 3
  adx_period: 14
  adx_trend_threshold: 25
  adx_range_threshold: 18
  adx_high_vol_threshold: 42
  bb_period: 20
  bb_std: 2.0
  stoch_k: 14
  stoch_d: 3
  stoch_smooth: 3
  range_rsi_oversold: 33
  range_rsi_overbought: 67
  range_bb_pct_buy: 0.12
  range_bb_pct_sell: 0.88
  high_vol_sl_multiplier: 1.6
  high_vol_size_scale: 0.65

sessions:
  enabled: true
  london:
    start: "07:00"
    end: "16:00"
  new_york:
    start: "12:00"
    end: "21:00"

ai:
  enabled: true
  min_confidence: 68
  model_type: "ensemble"
  retrain_interval: 360
  forward_bars: 12
  target_move_pct: 0.0025
  training_bars: 2000

optimizer:
  n_trials: 40
  interval_cycles: 3

trade_management:
  breakeven_r: 1.0
  breakeven_buffer_pts: 5
  trailing_r: 1.5
  trailing_atr_mult: 1.0
  trailing_step_r: 0.5
  partial_close: true
  partial_close_stages:
    - r: 1.0
      pct: 0.30
    - r: 2.0
      pct: 0.30
    - r: 3.0
      pct: 0.40
  time_exit_enabled: true
  time_exit_bars: 48
  time_exit_min_r: -0.3
  cooldown_minutes: 180
  news_filter_enabled: true
  news_blackout_before: 30
  news_blackout_after: 15
  min_sl_points: 12.0
  max_spread_gold: 10.0
  max_spread_forex: 6.0

execution:
  max_retries: 3
  retry_delay: 1
  deviation: 20

htf_filter:
  enabled: true
  timeframe: "H4"
  ema_period: 200
  bars: 250
  neutral_zone: 0.005

direction_ban:
  enabled: true
  max_same_dir_losses: 2
  ban_hours: 12
  ban_hours_soft: 4
  opposite_cooldown_min: 180

trend_dominance:
  enabled: true
  adx_strong_threshold: 28
  trend_strength_block: 0.55
  exhaustion_ema200_pct: 0.025
  rsi_recovery_level: 38
  rsi_rejection_level: 62
  rsi_momentum_swing: 5

market_intelligence:
  enabled: true
  adx_strong: 28
  divergence_lookback: 35
  swing_strength: 3
  displacement_atr_mult: 2.0
  reversal_score_threshold: 2

dashboard:
  refresh_interval: 5
  port: 8001

progressive_autonomy:
  enabled: true
  initial_level: 0
  max_level: 2

learning_analytics:
  enabled: true
  min_trades: 8
  block_win_rate: 0.20
  penalty_win_rate: 0.38
  lookback_days: 60

committee_guard:
  enabled: true
  fail_closed: true
  min_score: 0.62
  min_score_safe: 0.74
  min_agent_approvals: 3
  min_adjusted_score: 0.45
  max_uncertainty: 0.72
  max_reversal_probability: 0.70
  max_noise_score: 0.58
  max_chase_score: 0.58
  max_spread_atr_ratio: 0.10
  warning_spread_atr_ratio: 0.07
  htf_conflict_strength: 0.55
  blocked_regimes: ["HIGH_VOL", "EXHAUSTION"]
  caution_regimes: ["RANGE", "REVERSAL", "LIQUIDITY_GRAB", "ACCUMULATION", "DISTRIBUTION"]

logging:
  level: "DEBUG"
  file: "logs/trading.log"
  max_size_mb: 50
